name = "videolingo-community"
main = "src/index.js"
compatibility_date = "2026-01-01"

# 部署前：
# 1. 在 Cloudflare 控制台创建 R2 桶 videolingo-community 与 D1 数据库 videolingo-community-db
# 2. 将 D1 的 database_id 填入下方
#
# 敏感信息（ADMIN_TOKEN）不写入本文件（会明文分发）：
#   部署后执行 `npx wrangler secret put ADMIN_TOKEN` 以加密方式保存在 Cloudflare。
#   该令牌仅用于治理删除接口（DELETE /api/admin/resources/:id），可选设置。
#   浏览 / 点赞 / 下载 / 公开发布均为公开接口，软件分发无需任何令牌。

[[r2_buckets]]
binding = "COMMUNITY_BUCKET"
bucket_name = "videolingo-community"

[[d1_databases]]
binding = "DB"
database_name = "videolingo-community-db"
database_id = "87cf2ad5-0f1c-4202-bf4b-c1bd2f6fee6e"
