services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${API_IMAGE}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      CLUSTER_MODE: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      VOICEFORGE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      VOICEFORGE_CELERY_RESULT_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      CONTROL_PLANE_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      CONTROL_PLANE_CELERY_RESULT_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - app-data:/app/voiceforge_data
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "11001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11001/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    image: ${API_IMAGE}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "backend.control_plane.celery_runtime.celery_app", "worker", "--loglevel=INFO", "--pool=threads", "--concurrency=5", "--queues=videolingo_cpu,videolingo_gpu,videolingo_llm,videolingo_tts,videolingo_io,voiceforge_synthesis,voiceforge_voice,voiceforge_export"]
    environment:
      CLUSTER_MODE: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      VOICEFORGE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      VOICEFORGE_CELERY_RESULT_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      CONTROL_PLANE_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      CONTROL_PLANE_CELERY_RESULT_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - app-data:/app/voiceforge_data
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.control_plane.celery_runtime.celery_app inspect ping -d celery@$$HOSTNAME --timeout=3 | grep -q pong"]
      interval: 15s
      timeout: 8s
      retries: 6

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_FILE}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_FILE}:/etc/nginx/tls/privkey.pem:ro
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  app-data:
