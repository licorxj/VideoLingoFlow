# ============================================================
# LLM API Router - nginx 配置模板
# 由 entrypoint.sh 通过 envsubst 渲染：
#   ${BACKEND_PORT}  -> 后端 uvicorn 端口（默认 12002）
#   ${FRONTEND_PORT} -> 前端监听端口（默认 12001）
# 角色：提供前端静态文件，并将 /api、/v1 反向代理到后端。
# 容器内以非 root 用户运行，日志输出到 stdout/stderr。
# ============================================================

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 50m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    server {
        listen ${FRONTEND_PORT};
        server_name _;
        root /app/frontend/dist;
        index index.html;

        # 带 hash 的静态资源：长缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 管理 API（JSON，禁用缓冲与缓存）
        location /api/ {
            proxy_pass http://127.0.0.1:${BACKEND_PORT};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
        }

        # OpenAI 兼容接口（SSE 流式，必须关闭缓冲以逐块转发）
        location /v1/ {
            proxy_pass http://127.0.0.1:${BACKEND_PORT};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
        }
    }
}
